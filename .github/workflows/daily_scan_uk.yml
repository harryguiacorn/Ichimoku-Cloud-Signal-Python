name: Daily Ichimoku Scans - UK Markets

on:
  schedule:
    - cron: '30 17 * * 1-5'  # 17:30 UTC, after the UK session closes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        market:
          - { name: 'FTSE100', script: 'runFTSE100.py' }
          - { name: 'FTSE250', script: 'runFTSE250.py' }
          - { name: 'Futures', script: 'runFutures.py' }
          - { name: 'Currency Futures', script: 'runCurrencyFutures.py' }
          - { name: 'Oanda', script: 'runOanda.py' }
          - { name: 'Kraken', script: 'runKraken.py' }
      max-parallel: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ichimoku Scanner - ${{ matrix.market.name }}
        run: python ${{ matrix.market.script }}

      - name: Pull latest changes
        run: git pull origin master

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --staged --quiet; then
            echo "No changes to commit for ${{ matrix.market.name }}"
            exit 0
          fi

          git commit -m "Daily updates Github Action - ${{ matrix.market.name }}"

          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            if git push origin HEAD:master; then
              echo "Push successful"
              exit 0
            else
              echo "Push failed, retrying..."
              git pull --rebase origin master
              sleep 5
            fi
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
