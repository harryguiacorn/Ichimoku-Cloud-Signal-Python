<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Investor System | Tabulator</title>
    <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css">
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
    <style>
        :root {
            --ink: #17212b;
            --muted: #5b6875;
            --line: #d5dee5;
            --accent: #006d77;
            --paper: #f4f7f8;
            --surface: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--ink);
            background: var(--paper);
            font-family: Georgia, "Times New Roman", serif;
        }

        main {
            width: min(1120px, calc(100% - 48px));
            margin: 0 auto;
            padding: 36px 0 52px;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px 24px;
            margin-bottom: 12px;
        }

        header > div {
            flex: 1 1 300px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 5vw, 2.875rem);
            line-height: .95;
            letter-spacing: 0;
        }

        h2 {
            margin: 24px 0 12px;
            font-size: 1.4rem;
            letter-spacing: 0;
        }

        .scan-section-heading {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
        }

        .scan-section-heading h2 {
            margin-bottom: 8px;
        }

        p {
            color: var(--muted);
            margin: 6px 0 0;
            font-family: "Trebuchet MS", sans-serif;
        }

        .back-link {
            color: var(--accent);
            font-family: "Trebuchet MS", sans-serif;
            font-size: .9rem;
        }

        .header-links {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 20px;
            margin-left: auto;
            font-family: "Trebuchet MS", sans-serif;
            font-size: .9rem;
        }

        .subscribe-link {
            color: var(--accent);
            font-weight: bold;
        }

        .tabulator {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            background: var(--surface);
            font-family: "Trebuchet MS", sans-serif;
            box-shadow: 0 8px 24px rgba(23, 33, 43, .08);
        }

        .scan-table-scroll {
            max-width: 100%;
            overflow-x: auto;
            overscroll-behavior-x: contain;
            scrollbar-width: thin;
        }

        .scan-table-scroll > .tabulator {
            min-width: 600px;
        }

        .scan-scroll-cue {
            display: none;
        }

        .tabulator .tabulator-header {
            background: var(--ink);
            color: white;
            border-bottom: 0;
        }

        .tabulator .tabulator-header .tabulator-col {
            background: var(--ink);
            border-right: 1px solid #40505d;
        }

        .tabulator .tabulator-header .tabulator-col .tabulator-col-title {
            padding: 14px 16px;
            font-size: .82rem;
            font-weight: 700;
            letter-spacing: .035em;
            text-transform: uppercase;
        }

        .tabulator .tabulator-header-filter input {
            width: calc(100% - 12px);
            margin: 4px 6px 8px;
            padding: 6px;
            border: 1px solid #8aa0ad;
        }

        .tabulator-row .tabulator-cell {
            padding: 13px 16px;
            border-right: 1px solid #e7edf0;
        }

        .tabulator-row:nth-child(even) {
            background: #f8fafb;
        }

        .tabulator-row:hover {
            background: #e8f4f3 !important;
        }

        .tabulator a {
            color: var(--accent);
            font-weight: bold;
        }

        footer {
            margin-top: 34px;
            color: var(--muted);
            font: .8rem "Trebuchet MS", sans-serif;
        }

        @media (max-width: 650px) {
            main {
                width: min(1120px, calc(100% - 24px));
                padding-top: 24px;
            }

            header {
                align-items: flex-start;
            }

            .header-links {
                width: 100%;
                justify-content: flex-start;
                margin: 4px 0 0;
            }

            h2 {
                margin-top: 22px;
            }

            .tabulator .tabulator-header .tabulator-col .tabulator-col-title,
            .tabulator-row .tabulator-cell {
                padding-right: 10px;
                padding-left: 10px;
            }

            .scan-scroll-cue {
                display: block;
                flex: 0 0 auto;
                margin: 0 2px 8px 0;
                color: var(--accent);
                font-size: .72rem;
                font-weight: 700;
                white-space: nowrap;
            }
        }
    </style>
</head>

<body>
    <main>
        <header>
            <div>
                <h1>Apex Investor System</h1>
                <p>Market scan reports</p>
            </div>
            <nav class="header-links" aria-label="Site links">
                <a class="subscribe-link" href="https://apex-investor-system.kit.com/3f49b45822" data-formkit-toggle="fdcdb5aa03">
                    Subscribe to email digest
                </a>
                <a class="back-link" href="index_legacy.html">Legacy index</a>
            </nav>
        </header>

        <div class="scan-section-heading">
            <h2>Market Scans</h2>
            <p class="scan-scroll-cue">Swipe for Chikou <span aria-hidden="true">→</span></p>
        </div>
        <div class="scan-table-scroll" role="region" aria-label="Market scans, scroll horizontally to see Chikou Scan" tabindex="0">
            <div id="market-scans"></div>
        </div>

        <div class="scan-section-heading">
            <h2>Sector Scans</h2>
            <p class="scan-scroll-cue">Swipe for Chikou <span aria-hidden="true">→</span></p>
        </div>
        <div class="scan-table-scroll" role="region" aria-label="Sector scans, scroll horizontally to see Chikou Scan" tabindex="0">
            <div id="sector-scans"></div>
        </div>

        <div class="scan-section-heading">
            <h2>Major ETFs</h2>
            <p class="scan-scroll-cue">Swipe for Chikou <span aria-hidden="true">→</span></p>
        </div>
        <div class="scan-table-scroll" role="region" aria-label="Major ETF scans, scroll horizontally to see Chikou Scan" tabindex="0">
            <div id="major-etf-scans"></div>
        </div>

        <footer></footer>
    </main>
    <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
    <script>
        const marketRows = [
            ["S&P 500", "output/sum/SPX500-sum-cloud-tkx-merged.csv.tabulator.html", "output/sum/SPX500-chikou-merged.csv.tabulator.html"],
            ["Nasdaq 100", "output/sum/Nasdaq100-sum-cloud-tkx-merged.csv.tabulator.html", "output/sum/Nasdaq100-chikou-merged.csv.tabulator.html"],
            ["Dow Jones 30", "output/sum/DowJones30-sum-cloud-tkx-merged.csv.tabulator.html", "output/sum/DowJones30-chikou-merged.csv.tabulator.html"],
            ["Russell 1000", "output/sum/Russell1000-sum-cloud-tkx-merged.csv.tabulator.html", "output/sum/Russell1000-chikou-merged.csv.tabulator.html"],
            ["Oanda", "output/sum/Oanda-sum-cloud-tkx-merged.csv.tabulator.html", "output/sum/Oanda-chikou-merged.csv.tabulator.html"],
            ["Kraken Cryptocurrency", "output/sum/Kraken-sum-cloud-tkx-merged.csv.tabulator.html", "output/sum/Kraken-chikou-merged.csv.tabulator.html"],
            ["FTSE 100", "output/sum/FTSE100-sum-cloud-tkx-merged.csv.tabulator.html", "output/sum/FTSE100-chikou-merged.csv.tabulator.html"],
            ["FTSE 250", "output/sum/FTSE250-sum-cloud-tkx-merged.csv.tabulator.html", "output/sum/FTSE250-chikou-merged.csv.tabulator.html"],
            ["Futures", "output/sum/Futures-sum-cloud-tkx-merged.csv.tabulator.html", "output/sum/Futures-chikou-merged.csv.tabulator.html"],
            ["Futures Currency", "output/sum/FuturesCurrency-sum-cloud-tkx-merged.csv.tabulator.html", "output/sum/FuturesCurrency-chikou-merged.csv.tabulator.html"],
            ["Hang Seng Index", "output/sum/HSI-sum-cloud-tkx-merged.csv.tabulator.html", "output/sum/HSI-chikou-merged.csv.tabulator.html"]
        ].map(([market, cloud, chikou]) => ({ market, cloud, chikou }));

        const sectorRows = [
            ["All sectors", "SPDR_ETFS", "SPDR_ETFs"],
            ["XLC - Communication Services", "SPDR_ETF-XLC", "SPDR_ETF-XLC"],
            ["XLY - Consumer Discretionary", "SPDR_ETF-XLY", "SPDR_ETF-XLY"],
            ["XLP - Consumer Staples", "SPDR_ETF-XLP", "SPDR_ETF-XLP"],
            ["XLE - Energy", "SPDR_ETF-XLE", "SPDR_ETF-XLE"],
            ["XLF - Financials", "SPDR_ETF-XLF", "SPDR_ETF-XLF"],
            ["XLV - Health Care", "SPDR_ETF-XLV", "SPDR_ETF-XLV"],
            ["XLI - Industrials", "SPDR_ETF-XLI", "SPDR_ETF-XLI"],
            ["XLB - Materials", "SPDR_ETF-XLB", "SPDR_ETF-XLB"],
            ["XLRE - Real Estate", "SPDR_ETF-XLRE", "SPDR_ETF-XLRE"],
            ["XLK - Technology", "SPDR_ETF-XLK", "SPDR_ETF-XLK"],
            ["XLU - Utilities", "SPDR_ETF-XLU", "SPDR_ETF-XLU"]
        ].map(([sector, cloud, chikou]) => ({
            sector,
            cloud: `output/sum/${cloud}-sum-cloud-tkx-merged.csv.tabulator.html`,
            chikou: `output/sum/${chikou}-chikou-merged.csv.tabulator.html`
        }));

        const majorEtfRows = [
            {
                universe: "Institutional ETF & Index Basket",
                cloud: "output/sum/MajorETFs-sum-cloud-tkx-merged.csv.tabulator.html",
                chikou: "output/sum/MajorETFs-chikou-merged.csv.tabulator.html"
            }
        ];

        const linkFormatter = cell => `<a href="${cell.getValue()}">Open</a>`;
        const makeTable = (selector, data, firstColumn) => new Tabulator(selector, {
            data,
            layout: "fitColumns",
            responsiveLayout: false,
            resizableColumn: false,
            columns: [
                { title: firstColumn, field: firstColumn.toLowerCase(), headerSort: false, resizable: false, minWidth: 220, widthGrow: 2 },
                { title: "Cloud Scan", field: "cloud", formatter: linkFormatter, headerSort: false, resizable: false, minWidth: 150, widthGrow: 1 },
                { title: "Chikou Scan", field: "chikou", formatter: linkFormatter, headerSort: false, resizable: false, minWidth: 150, widthGrow: 1 }
            ]
        });
        makeTable("#market-scans", marketRows, "Market");
        makeTable("#sector-scans", sectorRows, "Sector");
        makeTable("#major-etf-scans", majorEtfRows, "Universe");
    </script>
    <script>
        (() => {
            const formUid = "fdcdb5aa03";
            let initialFields = null;

            const cacheInitialFields = () => {
                if (initialFields) return;
                const form = document.querySelector(
                    `form[data-uid="${formUid}"]`
                );
                const fields = form?.querySelector("[data-element='fields']");
                if (!fields) return;

                initialFields = fields.cloneNode(true);
                observer.disconnect();
            };

            const observer = new MutationObserver(cacheInitialFields);
            observer.observe(document.documentElement, {
                childList: true,
                subtree: true
            });
            cacheInitialFields();

            document.addEventListener("ckjs:overlay:hide", event => {
                if (!initialFields || !(event.target instanceof Element)) return;

                const form = event.target.querySelector(
                    `form[data-uid="${formUid}"]`
                );
                const success = form?.querySelector(
                    "[data-element='success']"
                );
                if (!success) return;

                success.removeAttribute("id");
                success.replaceWith(initialFields.cloneNode(true));
            });
        })();
    </script>
    <script async data-uid="fdcdb5aa03" src="https://apex-investor-system.kit.com/fdcdb5aa03/index.js"></script>
</body>

</html>
