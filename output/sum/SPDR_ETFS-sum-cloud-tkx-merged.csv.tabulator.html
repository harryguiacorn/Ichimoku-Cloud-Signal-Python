D Cloud Score":11,"1W Cloud Score":1,"1M Cloud Score":23,"Cloud Score Sum":32,"1H TKx Score":-10,"1D TKx Score":31,"1W TKx Score":-14,"1M TKx Score":34,"TKx Score Sum":41,"Total Score Sum":73},{"Symbol":"XLF","Name":"Financials","Close":54.83,"1H Cloud Score":-98,"1D Cloud Score":-1,"1W Cloud Score":17,"1M Cloud Score":71,"Cloud Score Sum":-11,"1H TKx Score":-63,"1D TKx Score":-6,"1W TKx Score":16,"1M TKx Score":33,"TKx Score Sum":-20,"Total Score Sum":-31},{"Symbol":"XLU","Name":"Utilities","Close":39.53,"1H Cloud Score":-81,"1D Cloud Score":-39,"1W Cloud Score":-1,"1M Cloud Score":190,"Cloud Score Sum":69,"1H TKx Score":-84,"1D TKx Score":-35,"1W TKx Score":-8,"1M TKx Score":-16,"TKx Score Sum":-143,"Total Score Sum":-74},{"Symbol":"XLRE","Name":"Real Estate","Close":41.56,"1H Cloud Score":-145,"1D Cloud Score":-18,"1W Cloud Score":69,"1M Cloud Score":27,"Cloud Score Sum":-67,"1H TKx Score":-51,"1D TKx Score":-33,"1W TKx Score":31,"1M TKx Score":26,"TKx Score Sum":-27,"Total Score Sum":-94}];

    const exactHeaderFilter = (headerValue, rowValue) =>
      String(rowValue ?? "").trim() === String(headerValue ?? "").trim();
    tableColumns.forEach(column => {
      column.headerFilterFunc = exactHeaderFilter;
    });
    const tabulatorTable = new Tabulator("#dataTableTabulator", {
      data: tableData,
      columns: tableColumns,
      layout: "fitDataTable",
      responsiveLayout: false,
      pagination: true,
      paginationSize: 50,
      paginationSizeSelector: [25, 50, 100, true],
      initialSort: [{column: tableColumns[tableColumns.length - 1].field, dir: "desc"}],
      placeholder: "No matching rows"
    });

    const applyNumericHighlights = () => {
      const rows = tabulatorTable.getRows();
      rows.forEach(row => {
        row.getCells().forEach(cell => {
          const rawValue = String(cell.getValue() ?? '').trim();
          const element = cell.getElement();
          element.classList.remove('highlight-positive', 'highlight-negative', 'highlight-neutral');

          const normalized = rawValue.toLowerCase();
          const field = String(cell.getColumn().getField() ?? '').toLowerCase();
          if (field.includes('state')) {
            if (normalized.startsWith('above')) element.classList.add('highlight-positive');
            else if (normalized.startsWith('below')) element.classList.add('highlight-negative');
            return;
          }

          const numericText = rawValue.replace(/,/g, '');
          if (/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(numericText)) {
            const value = Number(numericText);
            if (value > 0) element.classList.add('highlight-positive');
            else if (value < 0) element.classList.add('highlight-negative');
            else element.classList.add('highlight-neutral');
          }
        });
      });
    };

    tabulatorTable.on("renderComplete", applyNumericHighlights);
    tabulatorTable.on("dataLoaded", applyNumericHighlights);
  tabulatorTable.on("pageLoaded", applyNumericHighlights);
  </script>
