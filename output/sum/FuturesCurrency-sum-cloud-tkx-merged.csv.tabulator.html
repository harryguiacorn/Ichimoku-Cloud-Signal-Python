<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futures Currency Cloud Scan</title>
  <link rel="stylesheet" href="../../css/html_creator.css">
  <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css">
  <link rel="icon" type="image/x-icon" href="../../favicon/favicon.ico">
  <style>
    body { background: #eef2f4; color: #17212b; }
    .tabulator-page { max-width: 100%; margin: 0 auto; padding: 24px; }
    .tabulator { border: 2px solid #344955; background: #ffffff; box-shadow: 0 8px 20px rgba(23, 33, 43, .14); }
    .tabulator .tabulator-header, .tabulator .tabulator-header .tabulator-col { background: #17212b; color: #ffffff; }
    .tabulator .tabulator-header .tabulator-col { border-right: 1px solid #657782; }
    .tabulator .tabulator-header-filter input { background: #ffffff; color: #17212b; border: 2px solid #8ba3af; border-radius: 3px; }
    .tabulator-row { border-bottom: 1px solid #c4d0d6; }
    .tabulator-row:nth-child(even) { background: #e8f0f2; }
    .tabulator-row:hover { background: #b9dfe0 !important; }
    .tabulator .tabulator-cell { border-right: 1px solid #d0dbe0; white-space: normal !important; word-break: break-word; line-height: 1.4; }
    .tabulator .tabulator-header .tabulator-col { height: 80px !important; min-height: 80px !important; box-sizing: border-box; line-height: 1.25 !important; text-align: center !important; }
    .tabulator .tabulator-col-title { display: flex; align-items: center; justify-content: center; min-height: 28px; white-space: normal !important; word-break: break-word; line-height: 1.4; text-align: center; }
    .highlight-positive { background-color: #d1f2d1 !important; color: #0b6e3d !important; font-weight: 600; }
    .highlight-negative { background-color: #f8d7da !important; color: #8b1e2d !important; font-weight: 600; }
    .highlight-neutral { background-color: #e6e7e8 !important; color: #4a4a4a !important; }
  </style>
</head>
<body>
  <main class="tabulator-page">
    <nav class="scan-navigation" aria-label="Page navigation">
      <a href="../../index.html">Home</a>
    </nav>
    <h1>Futures Currency Cloud Scan</h1>
    <div id="dataTableTabulator"></div>
    <footer><p>Last updated: 2026-09-12 01:43:39 [UK]</p></footer>
  </main>
  <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
  <script>
    const tableData = [{"Symbol":"6S=F","Name":"Swiss Franc Futures","Close":1.24,"1H Cloud Score":14,"1D Cloud Score":-5,"1W Cloud Score":0,"1M Cloud Score":40,"Cloud Score Sum":49,"1H TKx Score":14,"1D TKx Score":-7,"1W TKx Score":-21,"1M TKx Score":31,"TKx Score Sum":17,"Total Score Sum":66},{"Symbol":"6E=F","Name":"Euro FX Futures","Close":1.16,"1H Cloud Score":9,"1D Cloud Score":19,"1W Cloud Score":0,"1M Cloud Score":15,"Cloud Score Sum":43,"1H TKx Score":14,"1D TKx Score":-1,"1W TKx Score":-24,"1M TKx Score":29,"TKx Score Sum":18,"Total Score Sum":61},{"Symbol":"6B=F","Name":"British Pound Futures","Close":1.35,"1H Cloud Score":-1,"1D Cloud Score":31,"1W Cloud Score":5,"1M Cloud Score":16,"Cloud Score Sum":51,"1H TKx Score":-33,"1D TKx Score":-3,"1W TKx Score":3,"1M TKx Score":31,"TKx Score Sum":-2,"Total Score Sum":49},{"Symbol":"6A=F","Name":"Australian Dollar Futures","Close":0.72,"1H Cloud Score":-34,"1D Cloud Score":20,"1W Cloud Score":55,"1M Cloud Score":3,"Cloud Score Sum":44,"1H TKx Score":-51,"1D TKx Score":34,"1W TKx Score":2,"1M TKx Score":6,"TKx Score Sum":-9,"Total Score Sum":35},{"Symbol":"6C=F","Name":"Canadian Dollar Futures","Close":0.72,"1H Cloud Score":0,"1D Cloud Score":20,"1W Cloud Score":0,"1M Cloud Score":-32,"Cloud Score Sum":-12,"1H TKx Score":-2,"1D TKx Score":38,"1W TKx Score":-16,"1M TKx Score":6,"TKx Score Sum":26,"Total Score Sum":14},{"Symbol":"6N=F","Name":"New Zealand Dollar Futures","Close":0.58,"1H Cloud Score":0,"1D Cloud Score":1,"1W Cloud Score":0,"1M Cloud Score":-46,"Cloud Score Sum":-45,"1H TKx Score":13,"1D TKx Score":-6,"1W TKx Score":2,"1M TKx Score":-18,"TKx Score Sum":-9,"Total Score Sum":-54},{"Symbol":"6J=F","Name":"Japanese Yen Futures","Close":0.01,"1H Cloud Score":14,"1D Cloud Score":9,"1W Cloud Score":0,"1M Cloud Score":-53,"Cloud Score Sum":-30,"1H TKx Score":14,"1D TKx Score":24,"1W TKx Score":-57,"1M TKx Score":-6,"TKx Score Sum":-25,"Total Score Sum":-55}];
    const tableColumns = [{"title": "Symbol<br>&nbsp;", "field": "Symbol", "headerFilter": "input"}, {"title": "Name<br>&nbsp;", "field": "Name", "headerFilter": "input"}, {"title": "Close<br>&nbsp;", "field": "Close", "headerFilter": "input", "sorter": "number", "hozAlign": "right"}, {"title": "1H<br>Cloud Score", "field": "1H Cloud Score", "headerFilter": "input", "sorter": "number", "hozAlign": "right"}, {"title": "1D<br>Cloud Score", "field": "1D Cloud Score", "headerFilter": "input", "sorter": "number", "hozAlign": "right"}, {"title": "1W<br>Cloud Score", "field": "1W Cloud Score", "headerFilter": "input", "sorter": "number", "hozAlign": "right"}, {"title": "1M<br>Cloud Score", "field": "1M Cloud Score", "headerFilter": "input", "sorter": "number", "hozAlign": "right"}, {"title": "Cloud<br>Score Sum", "field": "Cloud Score Sum", "headerFilter": "input", "sorter": "number", "hozAlign": "right"}, {"title": "1H<br>TKx Score", "field": "1H TKx Score", "headerFilter": "input", "sorter": "number", "hozAlign": "right"}, {"title": "1D<br>TKx Score", "field": "1D TKx Score", "headerFilter": "input", "sorter": "number", "hozAlign": "right"}, {"title": "1W<br>TKx Score", "field": "1W TKx Score", "headerFilter": "input", "sorter": "number", "hozAlign": "right"}, {"title": "1M<br>TKx Score", "field": "1M TKx Score", "headerFilter": "input", "sorter": "number", "hozAlign": "right"}, {"title": "TKx<br>Score Sum", "field": "TKx Score Sum", "headerFilter": "input", "sorter": "number", "hozAlign": "right"}, {"title": "Total Score Sum<br>&nbsp;", "field": "Total Score Sum", "headerFilter": "input", "sorter": "number", "hozAlign": "right"}];
    const exactHeaderFilter = (headerValue, rowValue) =>
      String(rowValue ?? "").trim() === String(headerValue ?? "").trim();
    tableColumns.forEach(column => {
      column.headerFilterFunc = exactHeaderFilter;
    });
    const tabulatorTable = new Tabulator("#dataTableTabulator", {
      data: tableData,
      columns: tableColumns,
      layout: "fitDataTable",
      responsiveLayout: false,
      pagination: true,
      paginationSize: 50,
      paginationSizeSelector: [25, 50, 100, true],
      initialSort: [{column: tableColumns[tableColumns.length - 1].field, dir: "desc"}],
      placeholder: "No matching rows"
    });

    const applyNumericHighlights = () => {
      const rows = tabulatorTable.getRows();
      rows.forEach(row => {
        row.getCells().forEach(cell => {
          const rawValue = String(cell.getValue() ?? '').trim();
          const element = cell.getElement();
          element.classList.remove('highlight-positive', 'highlight-negative', 'highlight-neutral');

          const normalized = rawValue.toLowerCase();
          const field = String(cell.getColumn().getField() ?? '').toLowerCase();
          if (field.includes('state')) {
            if (normalized.startsWith('above')) element.classList.add('highlight-positive');
            else if (normalized.startsWith('below')) element.classList.add('highlight-negative');
            return;
          }

          const numericText = rawValue.replace(/,/g, '');
          if (/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(numericText)) {
            const value = Number(numericText);
            if (value > 0) element.classList.add('highlight-positive');
            else if (value < 0) element.classList.add('highlight-negative');
            else element.classList.add('highlight-neutral');
          }
        });
      });
    };

    tabulatorTable.on("renderComplete", applyNumericHighlights);
    tabulatorTable.on("dataLoaded", applyNumericHighlights);
  tabulatorTable.on("pageLoaded", applyNumericHighlights);
  </script>
</body>
</html>
