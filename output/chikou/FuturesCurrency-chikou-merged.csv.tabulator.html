<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futures Currency Chikou Scan</title>
  <link rel="stylesheet" href="../../css/html_creator.css">
  <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css">
  <link rel="icon" type="image/x-icon" href="../../favicon/favicon.ico">
  <style>
    body { background: #eef2f4; color: #17212b; }
    .tabulator-page { max-width: 100%; margin: 0 auto; padding: 24px; }
    .tabulator { border: 2px solid #344955; background: #ffffff; box-shadow: 0 8px 20px rgba(23, 33, 43, .14); }
    .tabulator .tabulator-header, .tabulator .tabulator-header .tabulator-col { background: #17212b; color: #ffffff; }
    .tabulator .tabulator-header .tabulator-col { border-right: 1px solid #657782; }
    .tabulator .tabulator-header-filter input { background: #ffffff; color: #17212b; border: 2px solid #8ba3af; border-radius: 3px; }
    .tabulator-row { border-bottom: 1px solid #c4d0d6; }
    .tabulator-row:nth-child(even) { background: #e8f0f2; }
    .tabulator-row:hover { background: #b9dfe0 !important; }
    .tabulator .tabulator-cell { border-right: 1px solid #d0dbe0; white-space: normal !important; word-break: break-word; line-height: 1.4; }
    .tabulator .tabulator-col-title { white-space: normal !important; word-break: break-word; line-height: 1.4; }
    .highlight-positive { background-color: #d1f2d1 !important; color: #0b6e3d !important; font-weight: 600; }
    .highlight-negative { background-color: #f8d7da !important; color: #8b1e2d !important; font-weight: 600; }
    .highlight-neutral { background-color: #e6e7e8 !important; color: #4a4a4a !important; }
  </style>
</head>
<body>
  <main class="tabulator-page">
    <h1>Futures Currency Chikou Scan</h1>
    <div id="dataTableTabulator"></div>
    <footer><p>Last updated: 2026-09-08 22:34:01 [UK]</p></footer>
  </main>
  <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
  <script>
    const tableData = [{"Symbol":"6S=F","Name":"Swiss Franc Futures","1H Chikou Direction":-1,"1H Chikou Count":-26,"1H Chikou State":"below chikou","1D Chikou Direction":0,"1D Chikou Count":14,"1D Chikou State":"above chikou","1W Chikou Direction":-1,"1W Chikou Count":-13,"1W Chikou State":"below chikou","1M Chikou Direction":1,"1M Chikou Count":33,"1M Chikou State":"above chikou","Chikou Score Sum":8},{"Symbol":"6N=F","Name":"New Zealand Dollar Futures","1H Chikou Direction":-1,"1H Chikou Count":-18,"1H Chikou State":"below chikou","1D Chikou Direction":-1,"1D Chikou Count":-1,"1D Chikou State":"below chikou","1W Chikou Direction":0,"1W Chikou Count":-7,"1W Chikou State":"below chikou","1M Chikou Direction":-1,"1M Chikou Count":-13,"1M Chikou State":"below chikou","Chikou Score Sum":-39},{"Symbol":"6E=F","Name":"Euro FX Futures","1H Chikou Direction":0,"1H Chikou Count":3,"1H Chikou State":"above chikou","1D Chikou Direction":1,"1D Chikou Count":28,"1D Chikou State":"above chikou","1W Chikou Direction":0,"1W Chikou Count":-15,"1W Chikou State":"below chikou","1M Chikou Direction":1,"1M Chikou Count":17,"1M Chikou State":"above chikou","Chikou Score Sum":33},{"Symbol":"6C=F","Name":"Canadian Dollar Futures","1H Chikou Direction":1,"1H Chikou Count":8,"1H Chikou State":"above chikou","1D Chikou Direction":1,"1D Chikou Count":29,"1D Chikou State":"above chikou","1W Chikou Direction":-1,"1W Chikou Count":-14,"1W Chikou State":"below chikou","1M Chikou Direction":-1,"1M Chikou Count":-38,"1M Chikou State":"below chikou","Chikou Score Sum":-15},{"Symbol":"6J=F","Name":"Japanese Yen Futures","1H Chikou Direction":1,"1H Chikou Count":17,"1H Chikou State":"above chikou","1D Chikou Direction":1,"1D Chikou Count":28,"1D Chikou State":"above chikou","1W Chikou Direction":1,"1W Chikou Count":1,"1W Chikou State":"above chikou","1M Chikou Direction":-1,"1M Chikou Count":-13,"1M Chikou State":"below chikou","Chikou Score Sum":33},{"Symbol":"6B=F","Name":"British Pound Futures","1H Chikou Direction":1,"1H Chikou Count":17,"1H Chikou State":"above chikou","1D Chikou Direction":1,"1D Chikou Count":29,"1D Chikou State":"above chikou","1W Chikou Direction":1,"1W Chikou Count":2,"1W Chikou State":"above chikou","1M Chikou Direction":1,"1M Chikou Count":19,"1M Chikou State":"above chikou","Chikou Score Sum":67},{"Symbol":"6A=F","Name":"Australian Dollar Futures","1H Chikou Direction":1,"1H Chikou Count":72,"1H Chikou State":"above chikou","1D Chikou Direction":1,"1D Chikou Count":28,"1D Chikou State":"above chikou","1W Chikou Direction":1,"1W Chikou Count":66,"1W Chikou State":"above chikou","1M Chikou Direction":1,"1M Chikou Count":7,"1M Chikou State":"above chikou","Chikou Score Sum":173}];
    const tableColumns = [{"title": "Symbol", "field": "Symbol", "headerFilter": "input"}, {"title": "Name", "field": "Name", "headerFilter": "input"}, {"title": "1H Chikou Direction", "field": "1H Chikou Direction", "headerFilter": "input", "sorter": "number", "hozAlign": "right"}, {"title": "1H Chikou Count", "field": "1H Chikou Count", "headerFilter": "input", "sorter": "number", "hozAlign": "right"}, {"title": "1H Chikou State", "field": "1H Chikou State", "headerFilter": "input"}, {"title": "1D Chikou Direction", "field": "1D Chikou Direction", "headerFilter": "input", "sorter": "number", "hozAlign": "right"}, {"title": "1D Chikou Count", "field": "1D Chikou Count", "headerFilter": "input", "sorter": "number", "hozAlign": "right"}, {"title": "1D Chikou State", "field": "1D Chikou State", "headerFilter": "input"}, {"title": "1W Chikou Direction", "field": "1W Chikou Direction", "headerFilter": "input", "sorter": "number", "hozAlign": "right"}, {"title": "1W Chikou Count", "field": "1W Chikou Count", "headerFilter": "input", "sorter": "number", "hozAlign": "right"}, {"title": "1W Chikou State", "field": "1W Chikou State", "headerFilter": "input"}, {"title": "1M Chikou Direction", "field": "1M Chikou Direction", "headerFilter": "input", "sorter": "number", "hozAlign": "right"}, {"title": "1M Chikou Count", "field": "1M Chikou Count", "headerFilter": "input", "sorter": "number", "hozAlign": "right"}, {"title": "1M Chikou State", "field": "1M Chikou State", "headerFilter": "input"}, {"title": "Chikou Score Sum", "field": "Chikou Score Sum", "headerFilter": "input", "sorter": "number", "hozAlign": "right"}];
    const exactHeaderFilter = (headerValue, rowValue) =>
      String(rowValue ?? "").trim() === String(headerValue ?? "").trim();
    tableColumns.forEach(column => {
      column.headerFilterFunc = exactHeaderFilter;
    });
    const tabulatorTable = new Tabulator("#dataTableTabulator", {
      data: tableData,
      columns: tableColumns,
      layout: "fitDataTable",
      responsiveLayout: false,
      pagination: true,
      paginationSize: 50,
      paginationSizeSelector: [25, 50, 100, true],
      initialSort: [{column: tableColumns[tableColumns.length - 1].field, dir: "desc"}],
      placeholder: "No matching rows"
    });

    const applyNumericHighlights = () => {
      const rows = tabulatorTable.getRows();
      rows.forEach(row => {
        row.getCells().forEach(cell => {
          const rawValue = String(cell.getValue() ?? '').trim();
          const element = cell.getElement();
          element.classList.remove('highlight-positive', 'highlight-negative', 'highlight-neutral');

          const normalized = rawValue.toLowerCase();
          if (normalized.startsWith('above')) {
            element.classList.add('highlight-positive');
            return;
          }
          if (normalized.startsWith('below')) {
            element.classList.add('highlight-negative');
            return;
          }

          const value = Number.parseFloat(rawValue);
          if (Number.isFinite(value)) {
            if (value > 0) element.classList.add('highlight-positive');
            else if (value < 0) element.classList.add('highlight-negative');
            else element.classList.add('highlight-neutral');
          }
        });
      });
    };

    tabulatorTable.on("renderComplete", applyNumericHighlights);
    tabulatorTable.on("dataLoaded", applyNumericHighlights);
  </script>
</body>
</html>
