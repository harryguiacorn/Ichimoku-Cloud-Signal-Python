    .tabulator .tabulator-col-title { white-space: normal !important; word-break: break-word; line-height: 1.4; }
    .highlight-positive { background-color: #d1f2d1 !important; color: #0b6e3d !important; font-weight: 600; }
    .highlight-negative { background-color: #f8d7da !important; color: #8b1e2d !important; font-weight: 600; }
    .highlight-neutral { background-color: #e6e7e8 !important; color: #4a4a4a !important; }
  </style>
</head>
<body>

  </main>
  <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>

"1D Chikou Direction":-1,"1D Chikou Count":-1,"1D Chikou State":"below chikou"},{"Date":"2026-09-08","Symbol":"AAPL","Name":"Apple","1D Chikou Direction":1,"1D Chikou Count":1,"1D Chikou State":"above chikou"},{"Date":"2026-09-08","Symbol":"PG","Name":"Procter & Gamble","1D Chikou Direction":1,"1D Chikou Count":3,"1D Chikou State":"above chikou"},{"Date":"2026-09-08","Symbol":"GS","Name":"Goldman Sachs","1D Chikou Direction":0,"1D Chikou Count":3,"1D Chikou State":"above chikou"},{"Date":"2026-09-08","Symbol":"IBM","Name":"IBM","1D Chikou Direction":1,"1D Chikou Count":14,"1D Chikou State":"above chikou"},{"Date":"2026-09-08","Symbol":"JNJ","Name":"Johnson & Johnson","1D Chikou Direction":1,"1D Chikou Count":16,"1D Chikou State":"above chikou"},{"Date":"2026-09-08","Symbol":"DIS","Name":"Disney","1D Chikou Direction":1,"1D Chikou Count":24,"1D Chikou State":"above chikou"},{"Date":"2026-09-08","Symbol":"NVDA","Name":"Nvidia","1D Chikou Direction":1,"1D Chikou Count":26,"1D Chikou State":"above chikou"},{"Date":"2026-09-08","Symbol":"MSFT","Name":"Microsoft","1D Chikou Direction":1,"1D Chikou Count":30,"1D Chikou State":"above chikou"},{"Date":"2026-09-08","Symbol":"CRM","Name":"Salesforce","1D Chikou Direction":1,"1D Chikou Count":31,"1D Chikou State":"above chikou"},{"Date":"2026-09-08","Symbol":"CVX","Name":"Chevron","1D Chikou Direction":1,"1D Chikou Count":34,"1D Chikou State":"above chikou"},{"Date":"2026-09-08","Symbol":"V","Name":"Visa","1D Chikou Direction":1,"1D Chikou Count":59,"1D Chikou State":"above chikou"},{"Date":"2026-09-08","Symbol":"JPM","Name":"JPMorgan Chase","1D Chikou Direction":0,"1D Chikou Count":65,"1D Chikou State":"above chikou"},{"Date":"2026-09-08","Symbol":"KO","Name":"Coca-Cola","1D Chikou Direction":1,"1D Chikou Count":65,"1D Chikou State":"above chikou"},{"Date":"2026-09-08","Symbol":"AMGN","Name":"Amgen","1D Chikou Direction":1,"1D Chikou Count":66,"1D Chikou State":"above chikou"},{"Date":"2026-09-08","Symbol":"MRK","Name":"Merck","1D Chikou Direction":1,"1D Chikou Count":74,"1D Chikou State":"above chikou"}];
    const tableColumns = [{"title": "Date", "field": "Date", "headerFilter": "input"}, {"title": "Symbol", "field": "Symbol", "headerFilter": "input"}, {"title": "Name", "field": "Name", "headerFilter": "input"}, {"title": "1D Chikou Direction", "field": "1D Chikou Direction", "headerFilter": "input", "sorter": "number", "hozAlign": "right"}, {"title": "1D Chikou Count", "field": "1D Chikou Count", "headerFilter": "input", "sorter": "number", "hozAlign": "right"}, {"title": "1D Chikou State", "field": "1D Chikou State", "headerFilter": "input"}];
    const exactHeaderFilter = (headerValue, rowValue) =>
      String(rowValue ?? "").trim() === String(headerValue ?? "").trim();
    tableColumns.forEach(column => {
      column.headerFilterFunc = exactHeaderFilter;
    });
    const tabulatorTable = new Tabulator("#dataTableTabulator", {
      data: tableData,
      columns: tableColumns,
      layout: "fitDataTable",
      responsiveLayout: false,
      pagination: true,
      paginationSize: 50,
      paginationSizeSelector: [25, 50, 100, true],
      initialSort: [{column: tableColumns[tableColumns.length - 1].field, dir: "desc"}],
      placeholder: "No matching rows"
    });

    const applyNumericHighlights = () => {
      const rows = tabulatorTable.getRows();
      rows.forEach(row => {
        row.getCells().forEach(cell => {
          const rawValue = String(cell.getValue() ?? '').trim();
          const element = cell.getElement();
          element.classList.remove('highlight-positive', 'highlight-negative', 'highlight-neutral');

          const normalized = rawValue.toLowerCase();
          if (normalized.startsWith('above')) {
            element.classList.add('highlight-positive');
            return;
          }
          if (normalized.startsWith('below')) {
            element.classList.add('highlight-negative');
            return;
          }

          const value = Number.parseFloat(rawValue);
          if (Number.isFinite(value)) {
            if (value > 0) element.classList.add('highlight-positive');
            else if (value < 0) element.classList.add('highlight-negative');
            else element.classList.add('highlight-neutral');
          }
        });
      });
    };

    tabulatorTable.on("renderComplete", applyNumericHighlights);
    tabulatorTable.on("dataLoaded", applyNumericHighlights);
  </script>
</body>
